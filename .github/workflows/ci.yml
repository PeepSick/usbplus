name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://localhost:5432/usb_ci
          NEXT_TELEMETRY_DISABLED: 1

  secscan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secscan (offline fixture suite)
        run: python3 scripts/check-secscan.py

      - name: Contract artifact conformance
        run: python3 contracts/conformance/run_conformance.py

      - name: End-to-end reference corpus
        run: python3 contracts/conformance/run_e2e.py

      - name: mcprobe conformance
        run: python3 scripts/check-mcprobe.py

      - name: MCP stdio conformance
        run: python3 scripts/check-mcp.py
