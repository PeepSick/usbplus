name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://localhost:5432/usb_ci
          NEXT_TELEMETRY_DISABLED: 1

  cli:
    # The CLI is a bash script + python engines that users run on all three
    # platforms (Git Bash on Windows, the stock bash 3.2 on macOS), so the
    # offline suites run on all three too.
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: python3 shim (Windows)
        # The CLI calls `python3`; hosted Windows runners only guarantee `python`.
        if: runner.os == 'Windows'
        run: |
          py="$(command -v python)"
          [ -x "$(dirname "$py")/python3.exe" ] || cp "$py" "$(dirname "$py")/python3.exe"
          python3 --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Served CLI copies match packages/cli/bin/usb.sh
        # public/usb is what https://usbplus.peepsicklabs.com/usb serves; as a
        # hand-synced copy it drifted for four days. Fail loudly instead.
        run: node scripts/sync-cli.mjs --check

      - name: usb uninstall safety suite (offline, sandboxed HOME)
        run: bash scripts/check-uninstall.sh

      - name: Published engines are current and signed
        # public/engines/* must be byte copies of packages/cli/bin/*.py with a
        # valid signature; after touching an engine, re-run
        # `node scripts/sign-engines.mjs` locally (needs the private key).
        run: node scripts/sign-engines.mjs --check

      - name: usb verify/lock/diff/repair/hook/sarif/engines suite (offline, sandboxed HOME)
        run: bash scripts/check-integrity.sh

  secscan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CLI Python dependencies
        run: python3 -m pip install -r packages/cli/requirements.txt

      - name: Verify secscan (offline fixture suite)
        run: python3 scripts/check-secscan.py

      - name: Contract artifact conformance
        run: python3 contracts/conformance/run_conformance.py

      - name: End-to-end reference corpus
        run: python3 contracts/conformance/run_e2e.py

      - name: mcprobe conformance
        run: python3 scripts/check-mcprobe.py

      - name: MCP stdio conformance
        run: python3 scripts/check-mcp.py
